<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boord</title>
    <link rel="stylesheet" href="./stylesheets/styles.css">
</head>

<body>
    <header>
        <!-- NAVBAR -->
        <nav class="main-nav">
            <a href="#"><img src="https://placehold.co/200x50?text=Logo" alt="brand logo"></a>

            <!-- Search Bar -->
            <search>
                <input type="text" placeholder="Search...">
            </search>

            <!-- User Registration and Login -->
            <ul class="nav-links">
                <li><a href="#login">Login</a></li>
                <li><a href="#register" class="btn">Register</a></li>
            </ul>
        </nav>

        <hr>

        <nav class="tabs">
            <ul class="nav-links">
                <li><a href="#"><img src="../assets/explore.svg" alt="">Browse</a></li>
                <li><a href="#"><img src="../assets/search.svg" alt="">Search</a></li>
                <li><a href="#"><img src="../assets/group.svg" alt="">Following</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="browse">
        </section>

        <section id="search">
        </section>

        <section id="following">
        </section>

        <!-- USER LOGIN -->
        <section id="login" class="auth">
            <fieldset>
                <legend><h1>Log In</h1></legend>
                <!-- Email -->
                <label for="email">Email</label>
                <input type="email" id="email">
                <p id="email-error"></p>

                <!-- Password -->
                <label for="password">Password</label>
                <input type="password" id="password">
                <p id="password-error"></p>

                <button class="btn">Log In</button>
                <p>New here? <a href="#register">Click to register.</a></p>
            </fieldset>
        </section>

        <!-- USER REGISTRATION -->
        <section id="register" class="auth">
        </section>
    </main>

    <footer>
    </footer>
</body>

</html>
